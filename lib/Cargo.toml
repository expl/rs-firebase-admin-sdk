[package]
name = "rs-firebase-admin-sdk"
version = "5.1.0"
rust-version = "1.88"
edition = "2024"
authors = ["Kostas Petrikas"]
categories = ["authentication", "api-bindings", "asynchronous"]
description = "Firebase Admin SDK for Rust"
readme = "../README.md"
repository = "https://github.com/expl/rs-firebase-admin-sdk"
license = "MIT"

[lib]
doctest = false

[features]
default = ["tokens"]
tokens = ["dep:jsonwebtoken", "dep:jsonwebtoken-jwks-cache"]

[dependencies]
tokio = { version = "1", features = ["sync"], default-features = false }
error-stack = "0.8"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
http = "1.4"
headers = "0.4"
reqwest = { version = "0.13", features = ["charset", "json", "hickory-dns", "rustls", "brotli"], default-features = false }
urlencoding = "2.1"
bytes = "1"
google-cloud-auth = "1.19"
time = { version = "0.3", features = ["serde"] }
base64 = "0.23"
jsonwebtoken = { version = "12", optional = true }
jsonwebtoken-jwks-cache = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serial_test = "4"
